<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Student grade calculator</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    </head>
    <body>
        <div class="container">
            <div class="row">
                <div class="col-md-8">
                    <section>
                        <form>
                            <h2 class="text-primary">Student Grade Calculator</h2>
                            <div>
                                <label>Enter Student name</label>
                                <input type="text" placeholder="Enter Name" id="name" name="name" required>
                            </div>
                            <div>
                                <label>Subject 1</label>
                                <input type="text" placeholder="Enter subject 1 marks" id="subject1" name="subject1" required>
                            </div>
                            <div>
                                <label>Subject 2</label>
                                <input type="text" placeholder="Enter subject 2 marks" id="subject2" name="subject2" required>
                            </div>
                            <div>
                                <label>Subject 3</label>
                                <input type="text" placeholder="Enter subject 3 marks" id="subject3" name="subject3" required>
                            </div>
                            <div>
                                <label>Subject 4</label>
                                <input type="text" placeholder="Enter subject 4 marks" id="subject4" name="subject4" required>
                            </div>
                            <div>
                                <label>Subject 5</label>
                                <input type="text" placeholder="Enter subject 5 marks" id="subject5" name="subject5" required>
                            </div>
                            <div>
                                <label>Subject 6</label>
                                <input type="text" placeholder="Enter subject 6 marks" id="subject6" name="subject6" required>
                            </div>
                            <button type="button" class="btn btn-primary" onclick="calculator()">Calculate Grade</button>
                        </form>
                    </section>
                </div>
            </div>
        </div>
        <h4 id="result" class="md-4">Result:</h4>
        <script>
            function calculator(){
                let cal=confirm("Student Grade Calculator");
                let name=document.getElementById("name").value;
                let marks=[
                    document.getElementById("subject1").value,
                    document.getElementById("subject2").value,
                    document.getElementById("subject3").value,
                    document.getElementById("subject4").value,
                    document.getElementById("subject5").value,
                    document.getElementById("subject6").value
                ];
                let sum=0;
                let avg=0;
                var pass=true;
                for(let i=0;i<marks.length;i++){
                    let mark=Number(marks[i]);
                    if(mark<0||mark>100){
                        alert("please enter valid number between 0 to 100");
                        return;
                    }
                    if(mark<35){
                        pass=false;
                    }
                    if(!pass){
                        grade="Fail";
                    }
                    sum+=mark;
                }
                alert("Student name: "+name);
                console.log("Student name: "+name);
                alert("Total marks: "+sum);
                console.log("Total marks: "+sum);
                avg=sum/marks.length;
                alert("Average marks: "+avg);
                console.log("Average marks: "+avg);
                var grade="";
                switch(true){
                    case (avg>=90):grade="A";
                    break;
                     case (avg>=70):grade="B";
                    break;
                     case (avg>=50):grade="C";
                    break;
                     case (avg>=35):grade="D";
                    break;
                    default:grade="Fail";
                }
                alert("Grade: "+grade);  
                console.log("Grade: "+grade);
                document.getElementById("result").innerHTML="Name:"+name+
                "<br>Total marks:"+sum+
                "<br>Average marks:"+avg+
                "<br>Grade:"+grade;
            }
        </script>
    </body>
</html>
