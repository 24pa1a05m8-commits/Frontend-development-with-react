<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Login page</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width;initial-scale=1.0">
    </head>
    <body style="background-color:skyblue">
        <div style="margin:200px auto ;background-color:white ;border:solid black;border-radius:10px ;text-align:center;width:500px  ">
            <h2>LOGIN PAGE</h2>
            <form style="margin:100px auto  ;border-radius: 10px ;width:500px">
                <div>
                    <label>Name</label>
                    <input type="text" placeholder="Enter Name" id="name" name="name" required>
                </div><br>
                <div>
                    <label>Password</label>
                    <input type="password" placeholder="Enter password" id="password" name="password" required>
                </div><br>
                <button type="submit" style="background-color: lightgreen;">Submit</button>
            </form>
        </div>
    </body>
</html>
