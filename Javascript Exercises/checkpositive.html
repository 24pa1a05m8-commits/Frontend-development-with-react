<!DOCTYPE html>
<html lang="en">
    <head>
        <title>check whether the given number is positive or not</title>
    </head>
    <body>
        <script>
            function positive() {
                let n = prompt("Enter a number:");
                let num = parseInt(n);
                var result=num>0?"positive":"negative";
                alert(result);
            }
        </script>
        <button onclick="positive()">check number is positive or not</button>
    </body>
</html>
