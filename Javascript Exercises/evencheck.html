<!DOCTYPE html>
<html lang="en">
    <head>
        <title>check given number is even or odd</title>
    </head>
    <body>
        <script>
            function evencheck() {
                let n = prompt("Enter a number:");
                let num = parseInt(n);
                if(isNaN(num)||num<0){
                    alert("please enter a valid number");
                }
                var res=(num%2==0)?"even":"odd";
                alert(res);
            }
        </script>
        <button onclick="evencheck()">check number is even or odd</button>
    </body>
</html>
