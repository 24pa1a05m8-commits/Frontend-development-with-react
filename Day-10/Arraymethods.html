<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Array Methods</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
    </head>
    <body>
        <div>
                <button onclick="arrmap()">Array double</button>
                <button onclick="arrayUpper()">Array Uppercase</button>
                <button onclick="studname()">Student Names</button>
                <script>
                function arrmap(){
                    let arr=[1,2,3,4,5,6,7];
                    let arr2=arr.map((value)=>value*2);
                    console.log(arr2);
                    document.write("Original array:"+arr+"<br>");
                    document.write("New array:"+arr2);
                }
                function arrayUpper(){
                    let array=["teja","sree","lakshmi"];
                    let array2=array.map((value)=>value.toUpperCase());
                    console.log(array2);
                    document.write("Original array:"+array+"<br>");
                    document.write("New array:"+array2);
                }
                function studname(){
                    let students=[{id:1,name:"teja"},
                        {id:2,name:"sree"},
                        {id:3,name:"lakshmi"}
                    ];
                    let names=students.map((value)=>value.name);
                    console.log(names);
                    document.write("Original object: "+students);
                    document.write("<br> Names of students: "+names);
                }
            </script>
        </div>
    </body>
</html>
