<!DOCTYPE html> 
<html lang="en"> 
<head> 
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Web Storage Notes</title> 
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <style> 
        #container{ 
            display:flex; 
            justify-content:center; 
            margin:10px auto; 
        } 
        body h4, .notes-heading{ 
            text-align:center; 
            margin-top: 20px;
        } 
        #noteInput{ 
            display:block; 
            margin:10px auto; 
            margin-bottom:10px; 
        } 
        #notesDisplayList {
            max-width: 500px;
            margin: 20px auto;
            padding: 0 15px;
        }
        .note-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 10px;
            word-break: break-word;
        }
    </style> 
</head> 
<body> 
    <h4>Enter notes</h4> 
    <textarea id="noteInput" rows="4" cols="50" placeholder="Enter notes here"></textarea><br> 
    <div id="container"> 
        <button class="btn btn-primary" onclick="addNote()">Add Note</button> 
    </div> 
    <h5 class="notes-heading">Saved Notes</h5>
    <div id="notesDisplayList"></div>
<script>
    window.onload = function() {
        displayNotes();
    };
    function getNotesArray() {
        let rawNotes = localStorage.getItem("notes");
        if (!rawNotes) return [];
        try {
            let parsed = JSON.parse(rawNotes);
            return Array.isArray(parsed) ? parsed : [rawNotes];
        } catch (e) {
            return [rawNotes];
        }
    }
    function addNote(){ 
        let noteInput = document.getElementById("noteInput");
        let noteText = noteInput.value.trim(); 
        if(noteText.length === 0){ 
            alert("Please enter some notes to save"); 
            return;
        } 
        let notesArray = getNotesArray();
        notesArray.push(noteText);
        localStorage.setItem("notes", JSON.stringify(notesArray)); 
        noteInput.value = ""; 
        displayNotes();
    } 
    function displayNotes(){ 
        let notesArray = getNotesArray(); 
        let listContainer = document.getElementById("notesDisplayList");
        listContainer.innerHTML = "";      
        if(notesArray.length === 0) {
            listContainer.innerHTML = "<p class='text-muted text-center'>No notes saved yet.</p>";
            return;
        }
        notesArray.forEach((note, index) => {
            let noteItem = document.createElement("div");
            noteItem.className = "note-item";
            noteItem.innerHTML = `
                <span>${note}</span>
                <button class="btn btn-danger btn-sm" onclick="deleteNote(${index})">Delete</button>
            `;
            listContainer.appendChild(noteItem);
        });
    } 
    function deleteNote(index){ 
        let notesArray = getNotesArray(); 
        notesArray.splice(index, 1); 
        localStorage.setItem("notes", JSON.stringify(notesArray)); 
        displayNotes();
    } 
</script> 
</body> 
</html>
